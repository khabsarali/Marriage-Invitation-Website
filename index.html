<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b0a" />

    <title>Radia &amp; Umar — Wedding Invitation</title>
    <meta
      name="description"
      content="Together with their families, Radia &amp; Umar request the pleasure of your presence. 13–15 November 2026, Lahore."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Radia &amp; Umar — Wedding Invitation" />
    <meta
      property="og:description"
      content="A digital wedding invitation. Mehndi, Barat and Walima — 13–15 November 2026."
    />
    <meta property="og:image" content="/stills/walima-couple.webp" />

    <!-- Built by `npm run logo` from brand/monogram.jpg. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <!-- Preload for the film manifest. Commented out while
         ENABLE_3D_EXPERIENCE is false in src/config/scenes.config.js: a
         static preload ignores the flag and would fetch a 3D asset on every
         visit. Restore it when the film comes back.
    <link rel="preload" as="fetch" href="/frames/manifest.json" crossorigin /> -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: Georgia, serif; text-align: center">
        <h1>Radia &amp; Umar</h1>
        <p>This invitation needs JavaScript enabled. Mehndi 13, Barat 14, Walima 15 November 2026 — Lahore.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
