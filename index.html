<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0b09" />

    <title>Radia &amp; Umar — Wedding Celebrations</title>
    <meta
      name="description"
      content="Younus Abdul Karim &amp; Makia Younus joyfully announce the wedding celebrations of their beloved grand daughter Radia, with Umar. Dubai, 16–27 December 2026. Karachi, 6–8 January 2027."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Radia &amp; Umar — Wedding Celebrations" />
    <meta
      property="og:description"
      content="A royal celebration of love. Dubai, 16–27 December 2026 · Karachi, 6–8 January 2027."
    />
    <meta property="og:image" content="/stills/hero-wide.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Built by `npm run logo` from brand/monogram.jpg. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />

    <!-- The monogram is the whole preloader, and the plate is the first thing
         behind the invitation, so both are fetched alongside the bundle rather
         than after it. Nothing else is preloaded: the film's frames are not
         requested at all while ENABLE_3D_EXPERIENCE is false, and a static
         preload here would ignore that switch. -->
    <link rel="preload" as="image" href="/brand/mark.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="image"
      href="/stills/hero-wide.webp"
      media="(orientation: landscape)"
    />
    <link
      rel="preload"
      as="image"
      href="/stills/hero-tall.webp"
      media="(orientation: portrait)"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: Georgia, serif; text-align: center; line-height: 2">
        <h1 style="font-weight: 400; letter-spacing: 0.1em">RADIA &amp; UMAR</h1>
        <p>A royal celebration of love.</p>
        <p>Dubai — 16th–27th December 2026<br />Karachi — 6th–8th January 2027</p>
        <p>Formal invitation to follow.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
